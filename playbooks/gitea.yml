---
- name: Gitea configuration
  hosts: homelab
  become: true

  tasks:
    - name: Create git user
      user:
        name: git
        shell: /home/git/docker-shell
        create_home: yes

    - name: Create docker-shell script
      copy:
        content: |
          #!/bin/sh
          /usr/bin/docker exec -i -u git --env SSH_ORIGINAL_COMMAND="$SSH_ORIGINAL_COMMAND" gitea sh "$@"
        dest: /home/git/docker-shell
        mode: '0755'

    - name: Add git user to Docker group
      user:
        name: git
        groups: docker
        append: true

    - name: Modify sshd_config for git user
      blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          Match User git
          AuthorizedKeysCommandUser git
          AuthorizedKeysCommand /usr/bin/docker exec -i -u git gitea /usr/local/bin/gitea keys -e git -u %u -t %t -k %k
